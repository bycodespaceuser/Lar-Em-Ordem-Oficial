spring.application.name=lar-em-ordem
# Banco de dados H2.
spring.datasource.url=${DB_URL:jdbc:h2:file:./dados/laremordem}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
server.port=${PORT:8080}
# Console apenas no ambiente privado de desenvolvimento.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=${H2_CONSOLE_REMOTE:false}
server.forward-headers-strategy=framework
