<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarefas | Lar em Ordem</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <nav th:replace="~{fragmentos :: menu}"></nav>
    <main>
        <h1>Tarefas</h1>
        <p class="erro" th:if="${erro}" th:text="${erro}"></p>
        <section>
            <h2 th:text="${registro.id == null ? 'Novo cadastro' : 'Editar cadastro'}">Novo cadastro</h2>
            <!-- Formulário enviado ao Controller. -->
            <form th:action="@{/tarefas/salvar}" method="post">
                <input type="hidden" name="id" th:value="${registro.id}">
                <label for="nome">Nome da tarefa</label>
                <input id="nome" name="nome" required maxlength="255" th:value="${registro.nome}">
                <label for="comodoId">Cômodo</label>
                <select id="comodoId" name="comodoId" required>
                    <option value="">Selecione uma opção</option>
                    <option th:each="item : ${comodos}" th:value="${item.id}" th:text="${item.nome}" th:selected="${registro.comodo != null and registro.comodo.id == item.id}"></option>
                </select>
                <label for="categoriaId">Categoria</label>
                <select id="categoriaId" name="categoriaId" required>
                    <option value="">Selecione uma opção</option>
                    <option th:each="item : ${categorias}" th:value="${item.id}" th:text="${item.nome}" th:selected="${registro.categoria != null and registro.categoria.id == item.id}"></option>
                </select>
                <button type="submit" th:text="${registro.id == null ? 'Cadastrar' : 'Salvar alterações'}">Cadastrar</button>
                <a th:if="${registro.id != null}" th:href="@{/tarefas}">Cancelar</a>
            </form>
        </section>
        <section>
            <h2>Registros cadastrados</h2>
            <div class="tabela">
            <table>
                <thead><tr><th>ID</th> <th>Nome</th><th>Cômodo</th><th>Categoria</th><th>Ações</th></tr></thead>
                <tbody>
                    <!-- Percorre os registros consultados no banco. -->
                    <tr th:each="item : ${registros}">
                        <td th:text="${item.id}"></td>
                        <td th:text="${item.nome}"></td>
                        <td th:text="${item.comodo.nome}"></td>
                        <td th:text="${item.categoria.nome}"></td>
                        <td class="acoes">
                            <a class="editar" th:href="@{/tarefas/editar/{id}(id=${item.id})}">Editar</a>
                            <form th:action="@{/tarefas/excluir/{id}(id=${item.id})}" method="post"><button class="excluir" type="submit">Excluir</button></form>
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
            <p th:if="${registros.isEmpty()}">Nenhum registro cadastrado.</p>
        </section>
    </main>
</body>
</html>
